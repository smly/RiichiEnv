[package]
name = "riichienv-core"
version = "0.4.8"
edition = "2024"
license = "Apache-2.0"
description = "Japanese Mahjong (Riichi) game engine with MJAI protocol support"
repository = "https://github.com/smly/RiichiEnv"
keywords = ["mahjong", "riichi", "mjai", "game-engine"]
categories = ["game-engines", "simulation"]

[lib]
crate-type = ["rlib"]

[dependencies]
# DEBUG-ONLY: pyo3 dep temporarily disabled to avoid links="python" conflict.
# pyo3 = { version = "0.28", optional = true }
thiserror = "2.0"
derive_more = { version = "2.0", features = ["deref", "deref_mut", "into"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = { version = "1.0", optional = true }
rand = "0.10"
sha2 = "0.10"
hex = "0.4"
ndarray = "0.17"
base64 = "0.22"
riichi = { path = "../../../Equim-chan/Mortal/libriichi", package = "libriichi", optional = true, default-features = false }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "agari_bench"
harness = false

[[bench]]
name = "sp_bench"
harness = false

[features]
default = ["dep:flate2"]
python = []  # DEBUG-ONLY: pyo3 dep disabled, stub kept for #[cfg(...)] resolution
wasm = []
debug_mortal_sp = ["dep:riichi"]
